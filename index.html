<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gargadusa's Tower Tracker</title>
<style>
  :root {
    --bg: #14110f; --panel: #1d1916; --panel2: #25201c; --line: #3a322b; --line2: #4a4036;
    --text: #e9e1d6; --dim: #a89c8c; --faint: #7a6f62;
    --gold: #e0b252; --gold2: #f3d17e; --ember: #d9743a; --green: #7fbf7a; --blue: #78a8d8; --violet: #b68ae0; --red: #d46a5f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 10; background: linear-gradient(#1a1613, #14110f); border-bottom: 1px solid var(--line); padding: 12px 22px 0; }
  .top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .5px; color: var(--gold2); font-weight: 600; }
  h1 small { display: block; font-size: 12px; color: var(--dim); font-weight: 400; letter-spacing: 0; }
  .spacer { flex: 1; }
  select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--line2); border-radius: 7px; padding: 6px 10px; font: inherit; cursor: pointer; }
  select:hover, button:hover { border-color: var(--gold); }
  .live { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); }
  nav { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; scrollbar-width: thin; }
  nav button { white-space: nowrap; flex: none; }
  nav button { border: none; border-radius: 8px 8px 0 0; background: transparent; color: var(--dim); padding: 9px 16px; border-bottom: 2px solid transparent; }
  nav button.on { color: var(--gold2); border-bottom-color: var(--gold); background: var(--panel); }
  nav button .n { margin-left: 6px; font-size: 11px; color: var(--faint); background: var(--bg); padding: 1px 6px; border-radius: 9px; }
  main { padding: 20px 22px 60px; max-width: 1500px; margin: 0 auto; }
  h2 { font-size: 15px; color: var(--gold); margin: 26px 0 10px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  h2 small { color: var(--faint); text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .grid { display: grid; gap: 12px; }
  .g-legends { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .g-2 { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  .muted { color: var(--dim); } .faint { color: var(--faint); font-size: 12px; }
  .empty { padding: 36px; text-align: center; color: var(--faint); border: 1px dashed var(--line2); border-radius: var(--radius); }

  /* portraits + hero chips */
  .pic { width: 56px; height: 56px; border-radius: 8px; background: var(--panel2) center/cover no-repeat; border: 1px solid var(--line2); flex: none; display: grid; place-items: center; color: var(--faint); font-size: 22px; }
  .pic.sm { width: 34px; height: 34px; border-radius: 6px; font-size: 14px; }
  .pic.lg { width: 96px; height: 96px; border-radius: 10px; }
  .hero { display: flex; gap: 12px; align-items: center; }
  .hero .nm { font-weight: 600; font-size: 15px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line2); color: var(--dim); margin-right: 4px; }
  .tag.Active { color: var(--green); border-color: #3d5d3a; }
  .tag.Retired { color: var(--blue); border-color: #38506b; }
  .tag.Fallen, .tag.Gone { color: var(--red); border-color: #6b3a35; }
  .tag.kept { color: #c9b48a; border-color: #5b4d33; background: #2a2318; }
  .kept-dot { font-size: 11px; margin-left: 5px; opacity: .85; cursor: help; }
  .tag.gold { color: var(--gold2); border-color: #6e5a2a; }
  .tag.rare { color: var(--violet); border-color: #5a4572; }

  /* legends */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { border-radius: 16px; padding: 4px 11px; font-size: 13px; }
  .chip.on { background: #3a2f17; border-color: var(--gold); color: var(--gold2); }
  .chip.zero { opacity: .45; }
  .badge { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .badge:first-of-type { border-top: none; }
  .badge .ic { width: 20px; text-align: center; }
  .badge .lb { font-weight: 600; color: var(--gold2); min-width: 98px; }
  .badge .rs { color: var(--dim); flex: 1; }
  .badge .dt { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  .close-cat { margin-bottom: 14px; }
  .close-cat h4 { margin: 0 0 2px; font-size: 13px; } .close-cat .faint { margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
  .bar { flex: 1; height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #8a6a28, var(--gold2)); }
  .row .who { width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .val { width: 74px; text-align: right; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* ascended */
  .asc { padding: 0; overflow: hidden; }
  .asc-head { display: flex; gap: 16px; padding: 16px; background: linear-gradient(135deg, #2a2113, var(--panel)); border-bottom: 1px solid var(--line); }
  .asc-head .big { font-size: 19px; font-weight: 700; }
  .asc-type { color: var(--gold2); font-size: 15px; margin-top: 2px; } .asc-type i { color: var(--faint); font-style: italic; font-size: 13px; margin-left: 6px; }
  .asc-body { padding: 14px 16px 16px; display: grid; gap: 14px; }
  .timeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .step { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; position: relative; }
  .step .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); }
  .step .v { font-weight: 600; font-size: 13px; margin: 1px 0; }
  .step .d { font-size: 12px; color: var(--dim); }
  .step.fin { border-color: #6e5a2a; background: #231b0e; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
  .kv > div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
  .kv b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; } .kv span { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .6px; }
  .sec-t { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); margin-bottom: 5px; }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; } details summary:hover { color: var(--gold2); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
  .stats .grp b { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
  .stats .s { display: flex; justify-content: space-between; font-size: 12px; font-variant-numeric: tabular-nums; border-bottom: 1px dotted var(--line); padding: 1px 0; }

  /* awards table */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--panel2); color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  td.cat { white-space: nowrap; min-width: 190px; } td.cat small { display: block; color: var(--faint); font-size: 11px; max-width: 220px; white-space: normal; }
  td .w { font-weight: 600; } td .w.me { color: var(--gold2); }
  td .sub { font-size: 12px; color: var(--dim); }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .seg button { border: none; border-radius: 0; background: var(--panel); color: var(--dim); padding: 6px 16px; }
  .seg button.on { background: #3a2f17; color: var(--gold2); }
  .tally { margin-top: 18px; }

  /* cup */
  .season { margin-bottom: 18px; }
  .season-h { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; background: linear-gradient(135deg, #2a2113, var(--panel)); border-bottom: 1px solid var(--line); }
  .season-h b { font-size: 17px; color: var(--gold2); }
  .season .body { padding: 14px 16px 16px; display: grid; gap: 16px; }
  .champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .champ { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .champ .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); }
  .champ .v { font-weight: 600; font-size: 15px; margin-top: 2px; }
  .champ.main { border-color: #6e5a2a; background: #231b0e; } .champ.main .v { color: var(--gold2); font-size: 17px; }
  .champ.me { border-color: var(--green); }
  .podium { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 6px; }
  .pod { font-size: 13px; display: flex; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
  .pod .pl { color: var(--faint); width: 26px; font-variant-numeric: tabular-nums; } .pod .dv { color: var(--faint); font-size: 11px; }
  .pod.top { border-color: #6e5a2a; } .pod.top .pl { color: var(--gold2); }
  .team { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .team .card { padding: 8px 10px; background: var(--bg); }
  .stand { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .stand h4 { margin: 0 0 6px; font-size: 13px; color: var(--gold); } .stand .r { display: flex; gap: 8px; font-size: 13px; padding: 2px 0; }
  .stand .r span:first-child { width: 20px; color: var(--faint); } .stand .r span:nth-child(2) { flex: 1; } .stand .r span:last-child { color: var(--dim); font-variant-numeric: tabular-nums; }
  .stand .me { color: var(--gold2); font-weight: 600; }
  #err { background: #3a1d1a; border: 1px solid var(--red); color: #ffd7d2; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; display: none; }

  .hist th, .hist td { padding: 11px 14px; } .hist td.yr { font-weight: 700; font-size: 16px; width: 60px; }
  .hist tr.cur td { background: #261a16; }
  .hist .ev { display: flex; gap: 9px; align-items: center; } .hist .ev .gi { font-size: 20px; width: 30px; text-align: center; }
  .hist .ev b { color: var(--gold2); } .hist .you { font-size: 12px; color: var(--dim); margin-top: 1px; } .hist .you.win { color: var(--green); }
  .hist .pend { color: var(--faint); font-style: italic; font-size: 12px; }
  .hist-stats { display: flex; gap: 28px; padding: 14px 16px; border: 1px solid var(--line); border-top: none; background: var(--panel); border-radius: 0 0 var(--radius) var(--radius); }
  .hist-stats b { display: block; font-size: 20px; color: var(--gold2); font-variant-numeric: tabular-nums; } .hist-stats span { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); }

  .mem { padding: 0; overflow: hidden; } .mem .pic { filter: grayscale(.85) brightness(.85); }
  .mem-head { display: flex; gap: 14px; padding: 14px 16px; background: linear-gradient(135deg, #251a19, var(--panel)); border-bottom: 1px solid var(--line); }
  .mem-head .big { font-size: 17px; font-weight: 700; } .mem-head .when { color: var(--red); font-size: 13px; margin-top: 2px; }
  .mem-body { padding: 12px 16px 14px; display: grid; gap: 10px; }
  .mem .cause { font-size: 13px; } .mem .narr { font-style: italic; color: var(--dim); border-left: 2px solid var(--line2); padding-left: 10px; font-size: 13px; }

  .slain { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 1100px) { .slain { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .slain { grid-template-columns: 1fr; } }
  .slain .it { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .slain .tr { font-size: 18px; width: 22px; text-align: center; color: var(--gold); flex: none; }
  .slain .tt { font-weight: 600; font-size: 14px; line-height: 1.3; } .slain .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; } .slain .sub2 { color: var(--faint); font-size: 12px; margin-top: 2px; }
  .slain.far .tr { color: var(--ember); }

  .bar-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input[type=search] { background: var(--panel2); color: var(--text); border: 1px solid var(--line2); border-radius: 7px; padding: 6px 10px; font: inherit; min-width: 220px; }
  input:focus, select:focus { outline: none; border-color: var(--gold); }
  .alist { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
  .arow { border-top: 1px solid var(--line); } .arow:first-child { border-top: none; } .arow.open { background: #1f1a14; }
  .asum { display: flex; align-items: center; gap: 12px; padding: 8px 14px; cursor: pointer; } .asum:hover { background: var(--panel2); }
  .asum .who { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .asum .dt { width: 62px; } .asum .stat { width: 120px; text-align: right; } .asum .chev { color: var(--faint); width: 14px; }
  .asc-open { padding: 4px 16px 16px 60px; display: grid; gap: 12px; } .asc-top { display: flex; gap: 14px; align-items: flex-start; }
  @media (max-width: 800px) { .asc-open { padding-left: 16px; } }
  .tier-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .gtbl { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); }
  .gwrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: calc(100vh - 290px); min-height: 240px; }
  .gtbl th { cursor: pointer; user-select: none; white-space: nowrap; padding: 8px 10px; font-size: 11px; top: 0; z-index: 2; }
  .gtbl th.sorted { color: var(--gold2); } .gtbl td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  .gtbl tr.g:hover td { background: var(--panel2); cursor: pointer; } .gtbl tr.g.open td { background: #1f1a14; }
  .gtbl td.nm { font-weight: 600; } .gtbl .nmw { display: flex; align-items: center; gap: 9px; } .gtbl td.r { text-align: right; font-variant-numeric: tabular-nums; }
  .gtbl .tops { color: var(--dim); font-size: 12px; } .gtbl .tops b { color: var(--text); font-weight: 600; }
  .gtbl .grow { color: var(--green); font-size: 11px; }
  .t-S { color: var(--gold2); } .t-A { color: var(--violet); } .t-B { color: var(--blue); } .t-C { color: var(--green); } .t-D { color: var(--dim); } .t-F { color: var(--faint); }
  .oc-signed { color: var(--green); } .oc-delivered { color: var(--blue); } .oc-released { color: var(--ember); } .oc-pending { color: var(--gold2); }
  .gdet td { background: #1a1612; white-space: normal; padding: 10px 16px 14px 56px; }
  .gcount { color: var(--dim); font-size: 12px; margin-left: auto; }
  .tag.Injured { color: var(--red); border-color: #6b3a35; } .tag.Departed { color: var(--faint); }

  .yr-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
  @media (max-width: 1100px) { .yr-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .yr-grid { grid-template-columns: 1fr; } }
  .card.yr { padding: 0; overflow: hidden; } .yr-h { padding: 9px 14px; font-weight: 700; color: var(--gold2); background: linear-gradient(135deg, #2a2113, var(--panel)); border-bottom: 1px solid var(--line); letter-spacing: .5px; }
  .aw { display: flex; gap: 10px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--line); } .yr-h + .aw { border-top: none; }
  .aw .ic { width: 22px; text-align: center; font-size: 16px; flex: none; } .aw .bd { flex: 1; min-width: 0; }
  .aw .lb { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .8px; }
  .aw .w { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .aw .w.me { color: var(--gold2); }
  .aw .sub { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aw .val { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; max-width: 80px; }

  .cmd-cur { padding: 0; overflow: hidden; margin-bottom: 18px; }
  .cmd-cur .hd { display: flex; gap: 16px; padding: 14px 16px; background: linear-gradient(135deg, #2a2113, var(--panel)); border-bottom: 1px solid var(--line); }
  .cmd-cur .bd { padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .meter { margin-bottom: 8px; } .meter .t { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  .ccard { padding: 0; overflow: hidden; } .ccard .hd { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, #251f1a, var(--panel)); }
  .ccard .bd { padding: 10px 14px 12px; display: grid; gap: 8px; font-size: 13px; }
  .ccard .end-killed { color: var(--red); } .ccard .end-replaced { color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Gargadusa's Tower Tracker<small id="sub">loading…</small></h1>
    <div class="spacer"></div>
    <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">—</span></div>
    <select id="saveSel" title="Which save file to read"></select>
    <button id="reload" title="Re-read the save now">↻ Refresh</button>
  </div>
  <nav id="nav"></nav>
</header>
<main>
  <div id="err"></div>
  <div id="view"></div>
</main>

<script>
const TABS = [['legends', 'Hall of Fame'], ['ascended', 'Ascended Heroes'], ['awards', 'Yearly Awards'], ['cup', 'Crown Cup & League'], ['memorial', 'Memorial'], ['bestiary', 'Bestiary'], ['graduates', 'Academy Graduates'], ['commanders', 'Commanders']];
const S = { tab: 'legends', file: null, data: null, mtime: null, awardKind: 'guild', legendFilter: 'all', cupOpen: {}, saves: [],
  asc: { q: '', type: '', open: {} },
  gr: { q: '', tier: '', cls: '', role: '', status: '', outcome: '', year: '', sort: 'year', dir: -1, limit: 150, open: {} } };
let DEV = false;   // set at boot: no pywebview bridge => browser preview, read dev_data.json instead

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => (n == null || n === '') ? '—' : (typeof n === 'number' ? n.toLocaleString() : esc(n));
const when = w => w ? `Y${w.year}${w.week != null ? ' W' + w.week : ''}` : '—';
const pretty = s => String(s || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

/* ---------- api bridge ---------- */
async function api(name, ...a) {
  if (DEV) {
    if (name === 'list_saves') return { saves: [{ file: 'save_4.json', guild: 'Slime Time', year: 4, week: 34, mtime: Date.now() / 1000 }], selected: null };
    if (name === 'load') { try { return { ok: true, data: await (await fetch('dev_data.json')).json() }; } catch (e) { return { ok: false, error: 'dev_data.json missing' }; } }
    if (name === 'mtime') return S.mtime;
    if (name === 'portraits') return {};
    return null;
  }
  return window.pywebview.api[name](...a);
}

/* ---------- portraits ---------- */
const pCache = {};
function pic(key, cls = '', fallback = '👤') {
  const url = key && pCache[key];
  return `<div class="pic ${cls}" ${key ? `data-p="${esc(key)}"` : ''} ${url ? `style="background-image:url('${url}')"` : ''}>${url ? '' : fallback}</div>`;
}
async function fillPortraits() {
  const need = [...new Set([...document.querySelectorAll('[data-p]')].map(e => e.dataset.p))].filter(k => !(k in pCache));
  if (need.length) { const got = await api('portraits', need) || {}; for (const k of need) pCache[k] = got[k] || ''; }
  document.querySelectorAll('[data-p]').forEach(e => {
    const u = pCache[e.dataset.p];
    if (u) { e.style.backgroundImage = `url('${u}')`; e.textContent = ''; }
  });

const keptTag = k => k ? '<span class="tag kept" title="The game no longer holds this in your save — the tracker kept it">📦 kept</span>' : '';

/* ---------- Hall of Fame ---------- */
function viewLegends(d) {
  const defs = d.legendDefs, counts = d.legendCounts;
  const cats = Object.keys(defs);
  const f = S.legendFilter;
  let list = d.legends;
  if (f !== 'all') list = list.filter(l => l.badges.some(b => b.category === f));
  const total = d.legends.reduce((n, l) => n + l.badges.length, 0);
  const chips = `<div class="chips"><button class="chip ${f === 'all' ? 'on' : ''}" data-f="all">All <span class="faint">${total}</span></button>` +
    cats.map(c => `<button class="chip ${f === c ? 'on' : ''} ${counts[c] ? '' : 'zero'}" data-f="${c}" title="${esc(defs[c].desc)}">${defs[c].icon} ${esc(defs[c].label)} <span class="faint">${counts[c] || 0}</span></button>`).join('') + `</div>`;

  const cards = list.length ? `<div class="grid g-legends">` + list.map(l => `
    <div class="card">${heroLine(l, keptTag(l.kept))}
      <div style="margin-top:8px">${l.badges.map(b => `
        <div class="badge"><span class="ic">${esc(b.icon)}</span><span class="lb">${esc(b.label)}${keptDot(b.kept && !l.kept)}</span>
        <span class="rs">${esc(b.reason)}</span><span class="dt">${when(b.at)}</span></div>`).join('')}</div>
    </div>`).join('') + `</div>` : empty('No legends in this category yet.');

  const closing = d.closing.length ? d.closing.map(c => `
    <div class="close-cat card"><h4>${esc(c.icon)} ${esc(c.label)}</h4><div class="faint">${esc(c.desc)}</div>
    ${c.rows.map(r => `<div class="row"><span class="who" title="${esc(r.name)}">${esc(r.name)}</span>
      <div class="bar"><i style="width:${r.pct}%"></i></div><span class="val">${num(r.value)} / ${num(c.min)}</span></div>`).join('')}
    </div>`).join('') : empty('Nobody is past halfway to a legend badge yet.');

  const recRows = (obj, label) => Object.entries(obj).length ? `<div class="card"><div class="sec-t">${label}</div>` +
    Object.entries(obj).map(([k, v]) => `<div class="row"><span style="flex:1">${esc(pretty(k))}</span>
      <span class="${v.isPlayer ? 'tag gold' : ''}" title="${esc(v.guild)}">${esc(v.name)}</span><span class="val">${num(v.value)}</span></div>`).join('') + `</div>` : '';

  return `<div class="layout"><div><h2>Legends <small>${d.legends.length} heroes · ${total} inductions</small></h2>${chips}${cards}</div>
    <div><h2>Closing in <small>active heroes past 50%</small></h2>${closing}
    <h2>Records</h2>${recRows(d.records, 'Your guild')}<div style="height:10px"></div>${recRows(d.realmRecords, 'Realm')}</div></div>`;
}

}

/* ---------- Academy graduates ---------- */
const TIERS = ['F', 'D', 'C', 'B', 'A', 'S'];
const tierOf = p => (p || '').slice(0, 1);
const tierIdx = p => TIERS.indexOf(tierOf(p));
const GCOLS = [['name', 'Graduate'], ['class', 'Class'], ['potential', 'Potential'], ['role', 'Role'], ['level', 'Lv'], ['ovr', 'OVR'], ['top', 'Top stats'], ['age', 'Age'], ['sun', 'Sign'], ['status', 'Status'], ['outcome', 'Outcome'], ['year', 'Year']];
const gLevel = r => r.gradLevel, gOvr = r => r.gradOvr, gAge = r => r.gradAge;   // graduation values only - never the hero's current ones
const outcomeLabel = r => ({ signed: 'Signed', delivered: 'Delivered', released: r.fee ? `Released · ${num(r.fee)}g` : 'Released', pending: 'Awaiting decision' })[r.outcome] || '—';
function gradFiltered(d) {
  const G = S.gr, q = G.q.trim().toLowerCase();
  const rows = d.academy.grads.filter(r =>
    (!G.tier || tierOf(r.potential) === G.tier) && (!G.cls || r.class === G.cls) && (!G.role || r.role === G.role) &&
    (!G.status || (r.status || '—') === G.status) && (!G.outcome || r.outcome === G.outcome) && (!G.year || String(r.year) === G.year) &&
    (!q || `${r.name} ${r.class} ${r.role} ${r.sun || ''}`.toLowerCase().includes(q)));
  const key = { name: r => (r.name || '').toLowerCase(), class: r => r.class || '', potential: r => tierIdx(r.potential), role: r => r.role || '', level: r => gLevel(r) ?? -1,
    ovr: r => gOvr(r) ?? -1, top: r => ((r.snapTop || [])[0] ? r.snapTop[0].v : -1), age: r => gAge(r) ?? -1, sun: r => r.sun || '', status: r => r.status || '', outcome: r => r.outcome || '', year: r => r.year ?? -1 }[G.sort];
  rows.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : (a.name || '').localeCompare(b.name || '')) * G.dir; });
  return rows;
}
function gradRows(d) {
  const G = S.gr, rows = gradFiltered(d), shown = rows.slice(0, G.limit);
  const body = shown.map(r => {
    const open = !!G.open[r.id];
    const st = r.status || '—';
    let h = `<tr class="g ${open ? 'open' : ''}" data-gopen="${esc(r.id)}"><td class="nm"><div class="nmw">${pic(r.portrait, 'sm')}<span>${esc(r.name)}</span>${keptDot(r.kept)}</div></td>
      <td>${esc(r.class || '—')}</td><td class="t-${tierOf(r.potential)}"><b>${esc(r.potential || '—')}</b></td><td>${esc(r.role || '—')}</td>
      <td class="r">${num(gLevel(r))}</td><td class="r">${num(gOvr(r))}</td>
      <td class="tops">${(r.snapTop || []).map(t => `${t.k} <b>${t.v}</b>`).join(' · ') || '—'}</td><td class="r">${num(gAge(r))}</td><td>${esc(r.sun || '—')}</td>
      <td><span class="tag ${esc(st.split(' ')[0])}">${esc(st)}</span></td><td class="oc-${esc(r.outcome)}">${esc(outcomeLabel(r))}</td><td class="r">${r.year != null ? 'Y' + r.year : '—'}</td></tr>`;
    if (open) {
      const stats = (r.snap || []).map(g => `<div class="grp"><b>${esc(g.group)}</b>${g.stats.map(s => `<div class="s"><span>${s.k}</span><span>${s.v}</span></div>`).join('')}</div>`).join('');
      h += `<tr class="gdet"><td colspan="12"><div class="muted" style="margin-bottom:6px">${r.source ? `From ${esc(r.source)} · ` : ''}Graduated at Lv ${num(r.gradLevel)} · OVR ${num(r.gradOvr)} · age ${num(r.gradAge)}${r.snap ? ` · <span class="faint">stat sheet ${r.snapAt === 'graduation' ? 'recorded at graduation' : 'as first seen after graduation'}</span>` : ''}</div>
        ${r.traits?.length ? `<div style="margin-bottom:6px">${r.traits.map(t => `<span class="tag" title="${esc(t.desc)}">${esc(t.name)}</span>`).join('')}</div>` : ''}
        ${stats ? `<div class="stats">${stats}</div>` : '<span class="faint">No stat sheet recorded. The game only keeps graduation OVR/level/age once a graduate is signed, and the tracker never saw this one.</span>'}</td></tr>`;
    }
    return h;
  }).join('');
  const more = rows.length > shown.length ? `<div style="padding:10px;text-align:center"><button data-gmore="1">Show ${Math.min(150, rows.length - shown.length)} more (${rows.length - shown.length} hidden)</button></div>` : '';
  return { html: `<table class="gtbl"><thead><tr>${GCOLS.map(([k, l]) => `<th data-gsort="${k}" class="${G.sort === k ? 'sorted' : ''}">${l}${G.sort === k ? (G.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${body || '<tr><td colspan="12" class="faint" style="padding:30px;text-align:center">No graduates match these filters.</td></tr>'}</tbody></table>${more}`, n: rows.length };
}
function viewGraduates(d) {
  const A = d.academy, G = S.gr;
  if (!A.grads.length) return empty(`No graduates yet.${A.trainees ? ` ${A.trainees} trainee${A.trainees === 1 ? ' is' : 's are'} still enrolled.` : ''} Graduates show up here once a trainee finishes the Academy.`);
  const opt = (arr, cur, all) => `<option value="">${all}</option>` + arr.map(v => `<option ${cur === v ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const uniq = f => [...new Set(A.grads.map(f).filter(v => v != null && v !== ''))].sort((a, b) => typeof a === 'number' && typeof b === 'number' ? a - b : String(a).localeCompare(String(b)));
  const tierCounts = {}; A.grads.forEach(r => { const t = tierOf(r.potential); tierCounts[t] = (tierCounts[t] || 0) + 1; });
  const chips = `<div class="tier-chips"><button class="chip ${!G.tier ? 'on' : ''}" data-gtier="">All <span class="faint">${A.grads.length}</span></button>` +
    [...TIERS].reverse().map(t => `<button class="chip ${G.tier === t ? 'on' : ''} ${tierCounts[t] ? '' : 'zero'} t-${t}" data-gtier="${t}">${t}-Tier <span class="faint">${tierCounts[t] || 0}</span></button>`).join('') + `</div>`;
  return `<h2>Academy graduates <small>${A.total} total${A.trainees ? ` · ${A.trainees} still enrolled` : ''}${A.reputation ? ` · academy reputation ${Number(A.reputation).toFixed(2)}` : ''}</small></h2>${chips}
    <div class="bar-tools"><input type="search" data-gf="q" placeholder="Search name, class, role, sign…" value="${esc(G.q)}">
      <select data-gf="cls">${opt(uniq(r => r.class), G.cls, 'All classes')}</select>
      <select data-gf="role">${opt(uniq(r => r.role), G.role, 'All roles')}</select>
      <select data-gf="status">${opt(uniq(r => r.status || '—'), G.status, 'Any status')}</select>
      <select data-gf="outcome">${opt(uniq(r => r.outcome), G.outcome, 'Any outcome')}</select>
      <select data-gf="year">${opt(uniq(r => r.year).map(String), G.year, 'Any year')}</select>
      <button data-greset="1">Reset</button><span class="gcount" id="gcount"></span></div>
    <div class="gwrap" id="gwrap"></div>`;
}
function fillGrads() {
  const w = $('#gwrap'); if (!w || !S.data) return;
  const top = w.scrollTop, r = gradRows(S.data);
  w.innerHTML = r.html; w.scrollTop = top;
  $('#gcount').textContent = `Showing ${Math.min(r.n, S.gr.limit)} of ${r.n}`;
  fillPortraits();
}


/* ---------- Commanders ---------- */
function viewCommanders(d) {
  const C = d.commanders, cur = C.current, h = cur.hero;
  const meter = (label, v) => `<div class="meter"><div class="t"><span>${label}</span><span>${num(v)}</span></div><div class="bar"><i style="width:${Math.max(0, Math.min(100, v || 0))}%"></i></div></div>`;
  const adv = cur.advice || {};
  const mut = cur.mutinyStage && cur.mutinyStage !== 'calm';
  const curHtml = cur.name ? `<div class="card cmd-cur"><div class="hd">${pic(h?.portrait, 'lg')}<div>
      <div class="muted" style="font-size:11px;letter-spacing:1px;text-transform:uppercase">Current guild commander</div>
      <div style="font-size:19px;font-weight:700">${esc(cur.name)}</div>
      <div class="muted">${esc(h?.emoji || '')} ${esc(h?.class || '')} · Lv ${num(h?.level)} · OVR ${num(h?.ovr)}</div>
      <div style="margin-top:4px"><span class="tag gold">Since ${when(cur.appointed)}</span>${h?.tenure ? `<span class="tag">${esc(h.tenure.text)} in office</span>` : ''}${h?.ascended ? '<span class="tag gold">✦ Ascended</span>' : ''}${mut ? `<span class="tag Injured">Unrest: ${esc(pretty(cur.mutinyStage))}</span>` : '<span class="tag Active">Guild calm</span>'}</div>
    </div></div>
    <div class="bd"><div>${meter('Trust', cur.trust)}${meter('Approval', cur.approval)}</div>
      <div><div class="sec-t">Advice record</div><span class="tag Active">${adv.followed} followed</span><span class="tag">${adv.ignored} ignored</span><span class="tag gold">${adv.vindicated} vindicated</span><span class="tag Injured">${adv.missed} missed</span></div>
      <div><div class="sec-t">Career as commander</div><div class="muted">${num(h?.weeksAsCommander)} weeks · ${num(h?.questsAsCaptain)} quests as captain</div></div></div></div>` : empty('No commander appointed.');
  const past = C.past.map(x => `<div class="card ccard"><div class="hd">${pic(x.portrait)}<div>
      <div style="font-weight:700;font-size:15px">${esc(x.name)}${keptDot(x.kept)}</div>
      <div class="muted">${esc(x.emoji || '')} ${esc(x.class || '')}</div><div>${x.where ? whereTag(x.where) : ''}${x.ascended ? '<span class="tag gold">✦ Ascended</span>' : ''}</div></div></div>
    <div class="bd">
      <div><b>${when(x.start)}</b> → <b>${x.end ? when(x.end) : '?'}</b>${x.tenure ? ` <span class="faint">· ${esc(x.tenure.text)}</span>` : ''}</div>
      <div class="end-${esc(x.reason)}">${x.reason === 'killed' ? `☠ ${x.cause ? esc(x.cause) : 'Killed in office'}` : x.reason === 'replaced' ? 'Replaced' : 'End date unknown'}</div>
      <div class="kv"><div><b>${num(x.weeksAsCommander)}</b><span>Weeks served</span></div><div><b>${num(x.questsAsCaptain)}</b><span>Captain quests</span></div>${x.final ? `<div><b>${num(x.final.trust)}</b><span>Final trust</span></div><div><b>${num(x.final.approval)}</b><span>Final approval</span></div>` : ''}</div>
      ${x.trust?.length ? `<div><div class="sec-t">Trust shifts</div>${x.trust.map(t => `<span class="tag ${t.dir === 'up' ? 'Active' : 'Injured'}" title="${when(t)}">${t.dir === 'up' ? '▲' : '▼'} ${t.n} · ${when(t)}</span>`).join('')}</div>` : ''}
    </div></div>`).join('');
  return `<h2>Commanders</h2>${curHtml}<h2>Past commanders <small>${C.past.length}</small></h2>${past ? `<div class="yr-grid">${past}</div>` : empty('No former commanders on record yet.')}
    <div class="faint" style="margin-top:12px">End dates come from the next appointment or the hero's death, not farewell letters. Everything seen is archived.</div>`;
}

/* ---------- render / events ---------- */
function render() {
  const d = S.data;
  $('#nav').innerHTML = TABS.map(([id, label]) => {
    const n = d ? ({ legends: d.legends.length, ascended: d.ascended.length, awards: d.yearly.length, cup: d.cup.seasons.length, memorial: d.memorial.length, bestiary: d.bestiary.slain.length, graduates: d.academy.grads.length, commanders: d.commanders.past.length + (d.commanders.current.name ? 1 : 0) })[id] : '';
    return `<button data-t="${id}" class="${S.tab === id ? 'on' : ''}">${label}<span class="n">${n}</span></button>`;
  }).join('');
  if (!d) { $('#view').innerHTML = empty('Waiting for a save…'); return; }
  const g = d.guild;
  $('#sub').textContent = `${g.name} · Year ${g.year}, Week ${g.week}${g.season ? ' (' + g.season + ')' : ''} · Tier ${g.tier}`;
  const scroll = window.scrollY;
  $('#view').innerHTML = ({ legends: viewLegends, ascended: viewAscended, awards: viewAwards, cup: viewCup, memorial: viewMemorial, bestiary: viewBestiary, graduates: viewGraduates, commanders: viewCommanders })[S.tab](d);
  window.scrollTo(0, scroll);
  if (S.tab === 'graduates') fillGrads(); else fillPortraits();
}
document.addEventListener('click', e => {
  const x = e.target.closest('[data-asc],[data-aall],[data-gsort],[data-gopen],[data-gtier],[data-gmore],[data-greset]');
  if (x) {
    const D = x.dataset;
    if (D.asc != null) { S.asc.open[D.asc] = !S.asc.open[D.asc]; render(); }
    else if (D.aall) { S.asc.open = {}; if (D.aall === 'open') S.data.ascended.forEach(a => { S.asc.open[a.id] = true; }); render(); }
    else if (D.gsort) { const G = S.gr; if (G.sort === D.gsort) G.dir *= -1; else { G.sort = D.gsort; G.dir = ['name', 'class', 'role', 'status', 'sun'].includes(D.gsort) ? 1 : -1; } fillGrads(); }
    else if (D.gopen) { S.gr.open[D.gopen] = !S.gr.open[D.gopen]; fillGrads(); }
    else if (D.gtier != null) { S.gr.tier = D.gtier; S.gr.limit = 150; render(); }
    else if (D.gmore) { S.gr.limit += 150; fillGrads(); }
    else if (D.greset) { Object.assign(S.gr, { q: '', tier: '', cls: '', role: '', status: '', outcome: '', year: '', limit: 150 }); render(); }
    return;
  }
  const t = e.target.closest('[data-t],[data-f],[data-k],[data-open]');
  if (!t) return;
  if (t.dataset.t) S.tab = t.dataset.t;
  else if (t.dataset.f) S.legendFilter = t.dataset.f;
  else if (t.dataset.k) S.awardKind = t.dataset.k;
  else if (t.dataset.open) S.cupOpen[t.dataset.open] = !S.cupOpen[t.dataset.open];
  render();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.gf) { S.gr[t.dataset.gf] = t.value; S.gr.limit = 150; fillGrads(); }
  else if (t.dataset.af) {
    S.asc[t.dataset.af] = t.value; const pos = t.selectionStart; render();
    const n = document.querySelector('[data-af=q]');
    if (n && t.dataset.af === 'q') { n.focus(); n.setSelectionRange(pos, pos); }
  }
});
function setStatus(ok, txt) { $('#dot').className = 'dot' + (ok ? '' : ' err'); $('#liveTxt').textContent = txt; }
function showErr(msg) { const b = $('#err'); b.style.display = msg ? 'block' : 'none'; b.textContent = msg || ''; }

async function loadSave(quiet) {
  if (!S.file) return;
  const r = await api('load', S.file);
  if (!r.ok) { showErr(`Couldn't read ${S.file}: ${r.error} (the game may be mid-save — retrying)`); setStatus(false, 'read error'); return; }
  showErr('');
  S.data = r.data; S.mtime = r.data.meta.mtime;
  setStatus(true, `${S.file} · updated ${new Date(S.mtime * 1000).toLocaleTimeString()}${r.data.archive && r.data.archive.kept ? ` · 📦 ${r.data.archive.kept} kept beyond the game's save` : ''}`);
  render();
}
async function refreshSaves() {
  const r = await api('list_saves');
  S.saves = r.saves;
  if (!S.file) S.file = (r.selected && r.saves.find(s => s.file === r.selected)) ? r.selected : (r.saves[0] && r.saves[0].file);
  $('#saveSel').innerHTML = r.saves.map(s => `<option value="${esc(s.file)}" ${s.file === S.file ? 'selected' : ''}>${esc(s.file.replace('.json', ''))} — ${esc(s.guild || '?')}${s.year ? ` (Y${s.year} W${s.week})` : ''}</option>`).join('');
}
$('#saveSel').addEventListener('change', async e => {
  S.file = e.target.value; S.legendFilter = 'all'; S.cupOpen = {};
  await api('select_save', S.file); await loadSave();
});
$('#reload').addEventListener('click', loadSave);

setInterval(async () => {          // pick up changes while the game is running
  if (!S.file || DEV) return;
  const m = await api('mtime', S.file);
  if (m && S.mtime && m !== S.mtime) { await loadSave(true); refreshSaves(); }
}, 4000);

async function boot() {
  await refreshSaves(); await loadSave();
}
render();
if (window.pywebview && window.pywebview.api) boot();
else {
  let started = false;
  const go = dev => { if (started) return; started = true; DEV = dev; boot(); };
  window.addEventListener('pywebviewready', () => go(false), { once: true });
  setTimeout(() => go(!(window.pywebview && window.pywebview.api)), 2000);   // never became ready => browser preview
}
</script>
</body>
</html>
